<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Pro - Deployer Style</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-sub: #555555;
            --accent: #4285f4;
            --btn-light: #f8f9fa;
            --border: #dddddd;
            --shadow: 0 12px 40px rgba(0,0,0,0.12);
        }

        /* ダークモード設定 */
        body.dark-mode {
            --bg-color: #1a1a1b;
            --card-bg: #222222;
            --text-main: #dddddd;
            --text-sub: #bbbbbb;
            --btn-light: #333333;
            --border: #444444;
            --shadow: 0 12px 40px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* 等幅フォント */
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: 0.3s;
        }

        /* .card スタイル */
        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: var(--shadow);
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.6rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* ボタンデザイン */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            font-family: inherit;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background-color: var(--btn-light);
            color: var(--text-main);
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background-color: var(--border);
            transform: translateY(-1px);
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            border: none;
        }

        /* 入力エリア */
        .input-section {
            text-align: left;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--text-sub);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        /* 解析結果表示（改行問題を修正） */
        .result-area {
            background: rgba(0,0,0,0.03);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.6;
            min-height: 100px;
            white-space: pre-wrap; /* 改行を保持 */
            border: 1px dashed var(--border);
        }

        /* Markdown内の余白調整 */
        .result-area p { margin-bottom: 1em; }
        .result-area ul { padding-left: 20px; }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-sub);
            line-height: 1.8;
        }

        .link-text {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 GitHub Deployer v6</h2>

    <div class="btn-group">
        <button onclick="toggleTheme()">
            <span>🌙</span> Dark Mode
        </button>
        <a href="#" class="link-text">🚩 トークンを新規発行する</a>
    </div>

    <div class="input-section">
        <label>🔑 GitHub Access Token:</label>
        <input type="password" id="api-token" placeholder="ghp_xxxxxxxxxxxx">

        <label>📄 デプロイするファイル:</label>
        <textarea id="file-content" rows="3" placeholder="index.html, style.css..."></textarea>
    </div>

    <button class="btn-primary" onclick="saveToken()" style="width: 100%;">
        ✅ 構成を保存して解析
    </button>

    <div class="footer">
        N5. <code>System Ready</code><br>
        6. <code>Wait for input...</code>
    </div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid var(--border);">

    <div id="markdown-view" class="result-area">解析結果がここに表示されます...</div>
</div>

<script>
    // ダミー関数
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const btn = document.querySelector('button span');
        btn.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    function saveToken() {
        const token = document.getElementById('api-token').value;
        const resultView = document.getElementById('markdown-view');
        
        if(!token) {
            alert("🔑 トークンを入力してください");
            return;
        }

        // 表示テスト用のサンプルMarkdown（改行が正しく反映されるか確認用）
        const sampleMarkdown = `### ✅ 解析完了\n\n**1. 内容:** 構造を検知しました。\n\n**2. 構成:**\n* インデックス作成\n* スタイルの適用\n\n> 🚀 デプロイ準備が整いました。`;
        
        // markedを使用してパース
        resultView.innerHTML = marked.parse(sampleMarkdown);
        console.log("Token saved:", token);
    }
</script>

</body>
</html>
