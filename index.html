<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision Pro - Capture Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary: #4285f4; --success: #34a853; --dark: #202124; --bg: #f8f9fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--dark); line-height: 1.5; }
        .container { max-width: 500px; margin: auto; background: white; padding: 15px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .settings { text-align: left; background: #f1f3f4; padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #dadce0; font-size: 13px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        /* プレビューエリア */
        .preview-wrapper { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 3/4; margin-bottom: 12px; }
        video, #file-preview { width: 100%; height: 100%; object-fit: cover; display: block; }
        #file-preview { display: none; background: #333; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { padding: 15px; font-size: 15px; cursor: pointer; border: none; border-radius: 14px; font-weight: bold; color: white; transition: 0.3s; }
        button:active { transform: scale(0.95); }

        .btn-capture { background: var(--primary); grid-column: span 2; border-radius: 30px; font-size: 18px; }
        .btn-torch { background: #f4b400; color: #000; }
        .btn-file { background: #673ab7; }
        .btn-copy { background: #6c757d; }
        .btn-save { background: var(--success); grid-column: span 2; }

        #status { font-size: 12px; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-weight: bold; background: #fff3cd; text-align: center; word-break: break-all; }
        .result-box { position: relative; text-align: left; background: #fff; border: 2px solid #f0f0f0; border-radius: 16px; padding: 25px 15px 15px; min-height: 200px; margin-top: 10px; }
        .floating-copy { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; background: #f8f9fa; border: 1px solid #eee; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; z-index: 10; }

        /* 【修正】Markdown表示の改行と余白を制御 */
        #markdown-view { font-size: 14px; line-height: 1.7; word-wrap: break-word; }
        #markdown-view p { margin-bottom: 1.2em; }
        #markdown-view ul, #markdown-view ol { margin-bottom: 1.2em; padding-left: 20px; }
        #markdown-view li { margin-bottom: 0.5em; }
        #markdown-view table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12px; }
        #markdown-view th, #markdown-view td { border: 1px solid #ddd; padding: 8px; }

        .history-item { padding: 12px; border-bottom: 1px solid #f8f8f8; font-size: 11px; cursor: pointer; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="margin: 0 0 15px 0; color:var(--primary); text-align:center;">🤖 AI Vision Pro</h3>

    <div id="status">準備中...</div>

    <details class="settings">
        <summary>⚙️ 設定 (Gemini APIキーのみ)</summary>
        <input type="password" id="gemini-key" placeholder="Gemini API Key">
        <button onclick="saveKeys()" style="background:var(--dark); width:100%; margin-top:8px; color:white; padding:8px; border:none; border-radius:8px;">設定を保存</button>
    </details>

    <div class="preview-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <img id="file-preview" alt="選択された画像">
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button class="btn-capture" id="main-action-btn" onclick="captureAndAnalyze()">📸 解析を開始</button>
        <button class="btn-torch" id="torch-btn" onclick="toggleTorch()">🔦 ライトON</button>
        <button class="btn-file" onclick="document.getElementById('image-input').click()">📁 画像読込</button>
        <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
        <button class="btn-copy" onclick="copyToClipboard()">📋 コピー</button>
        <button class="btn-save" onclick="saveAsFile()">💾 名前を付けて保存</button>
    </div>

    <div class="result-box">
        <div id="copy-icon" class="floating-copy" onclick="copyToClipboard()">📋</div>
        <div id="markdown-view">ここに解析結果が表示されます</div>
        <textarea id="raw-text" style="display:none;"></textarea>
    </div>

    <div style="margin-top:20px; text-align: left;">
        <strong>📜 最近の履歴</strong>
        <div id="historyList"></div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const filePreview = document.getElementById('file-preview');
    const canvas = document.getElementById('canvas');
    const markdownView = document.getElementById('markdown-view');
    const rawText = document.getElementById('raw-text');
    const status = document.getElementById('status');
    const copyIcon = document.getElementById('copy-icon');
    const historyList = document.getElementById('historyList');

    let isTorchOn = false;
    let videoStream = null;
    let isFileMode = false;

    window.onload = () => {
        document.getElementById('gemini-key').value = localStorage.getItem('gemini_api_key') || "";
        setupCamera();
        loadHistory();
    };

    async function setupCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = videoStream;
            video.style.display = "block";
            filePreview.style.display = "none";
            isFileMode = false;
            updateStatus("✅ 準備完了", "#d4edda");
        } catch (err) {
            updateStatus("❌ カメラ制限中 (画像読込は可能です)", "#f8d7da");
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            filePreview.src = e.target.result;
            filePreview.style.display = "block";
            video.style.display = "none";
            isFileMode = true;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            updateStatus("📁 ファイルを読み込みました", "#d1ecf1");
            document.getElementById('main-action-btn').innerText = "🔍 この画像を解析";
        };
        reader.readAsDataURL(file);
    }

    async function toggleTorch() {
        if (!videoStream || isFileMode) return alert("カメラモード時のみ有効です");
        const track = videoStream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (!caps.torch) return alert("ライト制御非対応");
        isTorchOn = !isTorchOn;
        await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        document.getElementById('torch-btn').innerText = isTorchOn ? "🔦 ライトOFF" : "🔦 ライトON";
    }

    // 【修正】テキストの改行処理を強化
    function processText(text) {
        if (!text) return "";
        // 1. literalな "\n" (バックスラッシュ+n) を実際の改行に変換
        // 2. 連続する改行を調整してMarkdownの段落として認識させる
        return text.replace(/\\n/g, '\n').replace(/\n{3,}/g, '\n\n');
    }

    async function captureAndAnalyze() {
        const key = document.getElementById('gemini-key').value.trim();
        if (!key) return alert("Geminiキーを設定してください");

        updateStatus("📷 画像をキャプチャ中...", "#e2e3e5");
        const context = canvas.getContext('2d');

        if (isFileMode) {
            canvas.width = filePreview.naturalWidth;
            canvas.height = filePreview.naturalHeight;
            context.drawImage(filePreview, 0, 0);
        } else {
            if (video.videoWidth === 0) return updateStatus("⌛ カメラ待機中...", "#fff3cd");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);
            filePreview.src = canvas.toDataURL('image/jpeg');
            video.style.display = "none";
            filePreview.style.display = "block";
            isFileMode = true;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            isTorchOn = false;
            document.getElementById('torch-btn').innerText = "🔦 ライトON";
        }

        const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        updateStatus("⌛ AI解析を実行中...", "#e2e3e5");

        const prompt = `プロの文書解析者として、画像から【再現内容】（テキスト、表、図解）と、それを再生成するための【再現用プロンプト】を出力してください。日本語のみで、構造化して回答してください。`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }] })
            });

            const data = await response.json();
            const result = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!result) throw new Error("解析失敗");

            // 【修正】パース前に改行コードをクリーンアップ
            const cleanResult = processText(result);
            markdownView.innerHTML = marked.parse(cleanResult);
            rawText.value = cleanResult;
            
            updateStatus("✅ 解析完了", "#d4edda");
            saveHistory(cleanResult);
        } catch (e) {
            updateStatus(`❌ エラー: ${e.message}`, "#f8d7da");
        }
    }

    async function saveAsFile() {
        const content = rawText.value;
        if (!content) return alert("保存する内容がありません");
        const fileName = `AI_Vision_${new Date().getTime()}.txt`;
        if ('showSaveFilePicker' in window) {
            try {
                const handle = await window.showSaveFilePicker({suggestedName: fileName, types: [{ description: 'Text File', accept: { 'text/plain': ['.txt'] } }]});
                const writable = await handle.createWritable();
                await writable.write(content);
                await writable.close();
                updateStatus("✅ 保存しました", "#d4edda");
            } catch (err) { console.log("キャンセルされました"); }
        } else {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
            updateStatus("📥 ファイルを書き出しました", "#d1ecf1");
        }
    }

    function copyToClipboard() {
        if (!rawText.value) return;
        navigator.clipboard.writeText(rawText.value).then(() => {
            copyIcon.innerText = "✅";
            setTimeout(() => { copyIcon.innerText = "📋"; }, 2000);
            updateStatus("📋 コピーしました", "#d1ecf1");
        });
    }

    function saveKeys() {
        localStorage.setItem('gemini_api_key', document.getElementById('gemini-key').value);
        alert("設定を保存しました。");
        location.reload();
    }

    function updateStatus(msg, bg) { status.innerText = msg; status.style.background = bg; }
    function saveHistory(content) {
        let h = JSON.parse(localStorage.getItem('app_history') || '[]');
        h.unshift({ content, time: new Date().toLocaleTimeString() });
        localStorage.setItem('app_history', JSON.stringify(h.slice(0, 5)));
        loadHistory();
    }
    function loadHistory() {
        const h = JSON.parse(localStorage.getItem('app_history') || '[]');
        historyList.innerHTML = h.map(item => `<div class="history-item" onclick="restoreHistory('${item.content.replace(/'/g, "\\'").replace(/\n/g, "\\n")}')">🕒 ${item.time}: ${item.content.substring(0, 40)}...</div>`).join('');
    }
    function restoreHistory(c) {
        // 【修正】履歴からの復元時にも改行を処理
        const cleanContent = processText(c);
        markdownView.innerHTML = marked.parse(cleanContent);
        rawText.value = cleanContent;
        updateStatus("📜 履歴から復元", "#d1ecf1");
    }
</script>
</body>
</html>
