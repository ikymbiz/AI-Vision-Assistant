<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Setup</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --btn-bg: #e0e0e0;
            --btn-hover: #d0d0d0;
            --accent: #4285f4;
            --shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* ダークモード用（toggleThemeで切り替え） */
        body.dark-mode {
            --bg-color: #1a1a1b;
            --card-bg: #2d2d2e;
            --text-color: #f1f3f4;
            --btn-bg: #3c4043;
            --btn-hover: #4c5054;
            --shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background 0.3s ease;
        }

        /* .card スタイル: 中央配置・白背景・シャドウ */
        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 380px;
            text-align: center;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .icon-header {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* 入力フィールド */
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            margin-left: 5px;
            color: var(--text-color);
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            background-color: rgba(0,0,0,0.02);
            color: var(--text-color);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        body.dark-mode input {
            border-color: rgba(255,255,255,0.1);
            background-color: rgba(255,255,255,0.05);
        }

        input:focus {
            border-color: var(--accent);
        }

        /* ボタン: 薄い色・ホバーエフェクト */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: var(--btn-bg);
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--btn-hover);
            transform: scale(1.02);
        }

        button.primary {
            background-color: var(--accent);
            color: white;
        }

        button.primary:hover {
            opacity: 0.9;
            background-color: var(--accent);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-header">🚀</div>
        <h2>AI Vision Setup</h2>

        <div class="input-group">
            <label>🔑 API Token</label>
            <input type="password" id="api-token" placeholder="Enter your key here...">
        </div>

        <div class="btn-container">
            <button class="primary" onclick="saveToken()">
                <span>✅</span> トークンを保存
            </button>
            <button onclick="toggleTheme()">
                <span id="theme-icon">🌙</span> テーマを切り替え
            </button>
        </div>

        <div class="footer-note">
            N5. Connection Secured<br>
            6. All systems operational
        </div>
    </div>

    <script>
        // ダミー関数: テーマの切り替え
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            if (document.body.classList.contains('dark-mode')) {
                icon.innerText = '☀️';
            } else {
                icon.innerText = '🌙';
            }
            console.log("Theme toggled");
        }

        // ダミー関数: トークンの保存
        function saveToken() {
            const token = document.getElementById('api-token').value;
            if(!token) {
                alert("トークンを入力してください");
                return;
            }
            alert("トークンを保存しました (Dummy)");
            console.log("Token saved:", token);
        }
    </script>
</body>
</html>
