<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision Pro - Capture Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { 
            --primary: #4285f4; 
            --primary-dark: #3367d6;
            --success: #34a853; 
            --dark: #202124; 
            --bg: #f0f2f5; 
            --card-bg: #ffffff;
            --text-main: #3c4043;
            --text-sub: #5f6368;
        }
        
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 15px; 
            color: var(--text-main); 
            line-height: 1.6; 
        }

        .container { 
            max-width: 550px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 28px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }

        h3 { 
            margin-top: 0; 
            margin-bottom: 20px;
            color: var(--primary); 
            text-align: center; 
            font-size: 1.4rem;
            letter-spacing: -0.5px;
        }

        /* 設定セクション */
        .settings { 
            background: #f8f9fa; 
            padding: 10px 15px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            border: 1px solid #e8eaed; 
            font-size: 13px; 
        }
        .settings summary { cursor: pointer; color: var(--text-sub); font-weight: bold; outline: none; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #dadce0; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 14px;
        }

        /* プレビューエリア */
        .preview-wrapper { 
            position: relative; 
            width: 100%; 
            border-radius: 20px; 
            overflow: hidden; 
            background: #1a1a1b; 
            aspect-ratio: 4/3; 
            margin-bottom: 20px; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        video, #file-preview { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* コントロール */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        button { 
            padding: 14px; 
            font-size: 14px; 
            cursor: pointer; 
            border: none; 
            border-radius: 14px; 
            font-weight: 600; 
            color: white; 
            transition: all 0.2s ease; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        button:active { transform: translateY(2px); opacity: 0.9; }

        .btn-capture { background: var(--primary); grid-column: span 2; border-radius: 16px; font-size: 17px; padding: 18px; box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3); }
        .btn-capture:hover { background: var(--primary-dark); }
        .btn-torch { background: #ffffff; color: #3c4043; border: 1px solid #dadce0; }
        .btn-file { background: #ffffff; color: #3c4043; border: 1px solid #dadce0; }
        .btn-copy { background: #607d8b; }
        .btn-save { background: var(--success); grid-column: span 2; }

        /* ステータス表示 */
        #status { 
            font-size: 13px; 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            font-weight: 500; 
            background: #fff8e1; 
            text-align: center; 
            border: 1px solid #ffe082;
        }

        /* 解析結果ボックスの改善（ここが重要） */
        .result-box { 
            position: relative; 
            background: #fff; 
            border: 1px solid #e8eaed; 
            border-radius: 20px; 
            padding: 20px; 
            min-height: 200px; 
            margin-top: 10px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .floating-copy { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            width: 36px; 
            height: 36px; 
            background: rgba(255,255,255,0.9); 
            border: 1px solid #dadce0; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 16px; 
            z-index: 10;
            transition: 0.2s;
        }
        .floating-copy:hover { background: #f1f3f4; }

        /* Markdown表示の改行・余白設定 */
        #markdown-view { 
            font-size: 15px; 
            color: #202124;
            word-wrap: break-word;
        }
        #markdown-view p { margin: 0 0 1.2em 0; line-height: 1.7; }
        #markdown-view h1, #markdown-view h2, #markdown-view h3 { margin: 1.5em 0 0.8em 0; color: var(--primary); }
        #markdown-view ul, #markdown-view ol { padding-left: 20px; margin-bottom: 1.2em; }
        #markdown-view li { margin-bottom: 0.5em; }
        #markdown-view table { border-collapse: collapse; width: 100%; margin: 15px 0; font-size: 13px; display: block; overflow-x: auto; }
        #markdown-view th, #markdown-view td { border: 1px solid #dadce0; padding: 10px; text-align: left; }
        #markdown-view th { background: #f8f9fa; }
        #markdown-view code { background: #f1f3f4; padding: 2px 5px; border-radius: 4px; font-family: monospace; }

        /* 履歴 */
        .history-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .history-item { 
            padding: 12px; 
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 12px; 
            cursor: pointer; 
            color: var(--text-sub); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            border: 1px solid transparent;
        }
        .history-item:hover { background: #f1f3f4; border-color: #dadce0; }
    </style>
</head>
<body>

<div class="container">
    <h3>🤖 AI Vision Pro</h3>

    <div id="status">準備中...</div>

    <details class="settings">
        <summary>⚙️ API設定</summary>
        <input type="password" id="gemini-key" placeholder="Gemini API Key を入力">
        <button onclick="saveKeys()" style="background:var(--dark); width:100%; color:white; padding:10px; border-radius:8px; font-size:13px;">設定を保存してリロード</button>
    </details>

    <div class="preview-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <img id="file-preview" alt="選択された画像">
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button class="btn-capture" id="main-action-btn" onclick="captureAndAnalyze()">📸 解析を開始</button>
        <button class="btn-torch" id="torch-btn" onclick="toggleTorch()">🔦 ライト</button>
        <button class="btn-file" onclick="document.getElementById('image-input').click()">📁 画像読込</button>
        <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
        <button class="btn-copy" onclick="copyToClipboard()">📋 コピー</button>
        <button class="btn-save" onclick="saveAsFile()">💾 名前を付けて保存</button>
    </div>

    <div class="result-box">
        <div id="copy-icon" class="floating-copy" onclick="copyToClipboard()">📋</div>
        <div id="markdown-view">
            <p style="color:#999; text-align:center; margin-top:50px;">ここに解析結果が表示されます</p>
        </div>
        <textarea id="raw-text" style="display:none;"></textarea>
    </div>

    <div class="history-section">
        <strong style="font-size: 14px; display: block; margin-bottom: 10px;">📜 最近の履歴</strong>
        <div id="historyList"></div>
    </div>
</div>

<script>
    // --- JavaScript部分はロジックを維持しつつ、UI更新の整合性のみ調整 ---
    const video = document.getElementById('video');
    const filePreview = document.getElementById('file-preview');
    const canvas = document.getElementById('canvas');
    const markdownView = document.getElementById('markdown-view');
    const rawText = document.getElementById('raw-text');
    const status = document.getElementById('status');
    const copyIcon = document.getElementById('copy-icon');
    const historyList = document.getElementById('historyList');

    let isTorchOn = false;
    let videoStream = null;
    let isFileMode = false;

    window.onload = () => {
        document.getElementById('gemini-key').value = localStorage.getItem('gemini_api_key') || "";
        setupCamera();
        loadHistory();
    };

    async function setupCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = videoStream;
            video.style.display = "block";
            filePreview.style.display = "none";
            isFileMode = false;
            updateStatus("✅ 準備完了", "#e6f4ea", "#1e8e3e");
        } catch (err) {
            updateStatus("❌ カメラ制限中 (画像読込を使用してください)", "#fce8e6", "#d93025");
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            filePreview.src = e.target.result;
            filePreview.style.display = "block";
            video.style.display = "none";
            isFileMode = true;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            updateStatus("📁 ファイルを読み込みました", "#e8f0fe", "#1967d2");
            document.getElementById('main-action-btn').innerText = "🔍 この画像を解析";
        };
        reader.readAsDataURL(file);
    }

    async function toggleTorch() {
        if (!videoStream || isFileMode) return alert("カメラモード時のみ有効です");
        const track = videoStream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (!caps.torch) return alert("ライト制御非対応");
        isTorchOn = !isTorchOn;
        await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        document.getElementById('torch-btn').innerText = isTorchOn ? "🔦 ライトOFF" : "🔦 ライトON";
    }

    async function captureAndAnalyze() {
        const key = document.getElementById('gemini-key').value.trim();
        if (!key) return alert("Geminiキーを設定してください");

        updateStatus("📷 画像を処理中...", "#f8f9fa", "#5f6368");
        const context = canvas.getContext('2d');

        if (isFileMode) {
            canvas.width = filePreview.naturalWidth;
            canvas.height = filePreview.naturalHeight;
            context.drawImage(filePreview, 0, 0);
        } else {
            if (video.videoWidth === 0) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);
            filePreview.src = canvas.toDataURL('image/jpeg');
            video.style.display = "none";
            filePreview.style.display = "block";
            isFileMode = true;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        updateStatus("⌛ AI解析を実行中...", "#e8f0fe", "#1967d2");

        // プロンプトは変更なし
        const prompt = `プロの文書解析者として、提供された画像から以下の2点を出力してください。
1. 【再現内容】
全テキスト抽出、表のMarkdown化、図解の文章解説。
2. 【再現用プロンプト】
この画像のデザインをAIで再生成するための詳細な指示文。
出力は日本語のみ、前置き不要。`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }] })
            });

            const data = await response.json();
            const result = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!result) throw new Error("解析失敗");

            markdownView.innerHTML = marked.parse(result);
            rawText.value = result;
            updateStatus("✅ 解析完了", "#e6f4ea", "#1e8e3e");
            saveHistory(result);
        } catch (e) {
            updateStatus(`❌ エラー: ${e.message}`, "#fce8e6", "#d93025");
        }
    }

    async function saveAsFile() {
        const content = rawText.value;
        if (!content) return alert("保存する内容がありません");
        const fileName = `AI_Vision_${new Date().getTime()}.txt`;
        if ('showSaveFilePicker' in window) {
            try {
                const handle = await window.showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'Text File', accept: { 'text/plain': ['.txt'] } }] });
                const writable = await handle.createWritable();
                await writable.write(content);
                await writable.close();
            } catch (err) {}
        } else {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }
    }

    function copyToClipboard() {
        if (!rawText.value) return;
        navigator.clipboard.writeText(rawText.value).then(() => {
            copyIcon.innerText = "✅";
            setTimeout(() => { copyIcon.innerText = "📋"; }, 2000);
        });
    }

    function saveKeys() {
        localStorage.setItem('gemini_api_key', document.getElementById('gemini-key').value);
        location.reload();
    }

    function updateStatus(msg, bg, color) { 
        status.innerText = msg; 
        status.style.background = bg; 
        status.style.color = color || "#202124"; 
    }

    function saveHistory(content) {
        let h = JSON.parse(localStorage.getItem('app_history') || '[]');
        h.unshift({ content, time: new Date().toLocaleTimeString() });
        localStorage.setItem('app_history', JSON.stringify(h.slice(0, 5)));
        loadHistory();
    }

    function loadHistory() {
        const h = JSON.parse(localStorage.getItem('app_history') || '[]');
        historyList.innerHTML = h.map(item => `<div class="history-item" onclick="restoreHistory('${item.content.replace(/'/g, "\\'").replace(/\n/g, "\\n")}')">🕒 ${item.time}: ${item.content.substring(0, 60)}...</div>`).join('');
    }

    function restoreHistory(c) {
        markdownView.innerHTML = marked.parse(c);
        rawText.value = c;
        updateStatus("📜 履歴から復元", "#f1f3f4", "#5f6368");
    }
</script>
</body>
</html>
