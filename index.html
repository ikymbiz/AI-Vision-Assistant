<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision Pro | Expert Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: rgba(226, 232, 240, 0.8);
            --glass: rgba(255, 255, 255, 0.7);
            --blur: blur(16px);
        }

        body.dark-mode {
            --bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.9);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: rgba(30, 41, 59, 0.8);
            --glass: rgba(15, 23, 42, 0.7);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            background-image: fixed;
            background-image: radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            margin: 0; 
            padding: env(safe-area-inset-top) 15px 40px 15px; 
            color: var(--text-main); 
            transition: all 0.3s ease;
        }

        .container { 
            max-width: 550px; 
            margin: auto; 
            background: var(--card-bg); 
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            padding: 28px; 
            border-radius: 32px; 
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); 
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .btn-theme { background: var(--glass); border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; transition: 0.3s; }

        #status { font-size: 13px; padding: 12px; border-radius: 16px; margin-bottom: 20px; font-weight: 600; text-align: center; border: 1px solid transparent; }

        details.settings { background: var(--glass); border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border); transition: 0.3s; }
        summary { padding: 14px; cursor: pointer; font-size: 14px; font-weight: bold; color: var(--text-sub); list-style: none; display: flex; align-items: center; gap: 8px; }
        .settings-content { padding: 0 14px 14px 14px; }
        input[type="password"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text-main); outline: none; transition: 0.2s; }
        input[type="password"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .preview-wrapper { position: relative; width: 100%; border-radius: 24px; overflow: hidden; background: #000; aspect-ratio: 3/4; margin-bottom: 24px; border: 4px solid var(--card-bg); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        video, #file-preview { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }

        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        button { border: none; border-radius: 18px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:active { transform: scale(0.96); }

        .btn-capture { background: var(--primary); color: white; grid-column: span 2; height: 64px; font-size: 18px; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        .btn-capture:hover { background: var(--primary-light); }
        
        .btn-sub { background: var(--glass); color: var(--text-main); border: 1px solid var(--border); height: 50px; font-size: 14px; }
        .btn-save { background: #10b981; color: white; grid-column: span 2; height: 50px; margin-top: 8px; }

        .result-box { 
            position: relative; 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            padding: 24px; 
            min-height: 200px; 
            margin-top: 24px;
        }
        .floating-copy { 
            position: absolute; top: 15px; right: 15px; width: 44px; height: 44px; 
            background: var(--primary); border-radius: 14px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; color: white; z-index: 10;
        }

        #markdown-view { font-size: 15px; color: var(--text-main); line-height: 1.8; }
        #markdown-view h1, #markdown-view h2, #markdown-view h3 { color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-top: 24px; }
        #markdown-view table { width: 100%; border-collapse: collapse; margin: 15px 0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        #markdown-view th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        #markdown-view td { background: var(--glass); border-bottom: 1px solid var(--border); padding: 12px; }

        .history-section { margin-top: 32px; border-top: 2px dashed var(--border); padding-top: 20px; }
        .history-title { font-size: 15px; font-weight: 800; color: var(--text-sub); margin-bottom: 12px; }
        .history-item { 
            padding: 15px; border-radius: 18px; margin-bottom: 10px; 
            font-size: 13px; cursor: pointer; color: var(--text-main); 
            background: var(--glass); border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .scanning::after {
            content: ""; position: absolute; left: 0; width: 100%; height: 4px;
            background: var(--primary-light); box-shadow: 0 0 15px var(--primary);
            animation: scan 2s linear infinite; z-index: 5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo"><i class="fas fa-microchip"></i> AI Vision Pro</div>
        <button class="btn-theme" onclick="toggleTheme()" id="theme-btn"><i class="fas fa-moon"></i></button>
    </div>

    <div id="status" style="background: #eff6ff; color: #1e40af;">Ready to scan</div>

    <details class="settings">
        <summary><i class="fas fa-cog"></i> API Key Setup</summary>
        <div class="settings-content">
            <input type="password" id="gemini-key" placeholder="Enter Gemini API Key">
            <button onclick="saveKeys()" style="margin-top:10px; background:var(--primary); color:white; width:100%; padding:10px; border-radius:10px;">Save Key</button>
        </div>
    </details>

    <div class="preview-wrapper" id="preview-box">
        <video id="video" autoplay playsinline muted></video>
        <img id="file-preview">
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button class="btn-capture" id="main-btn" onclick="captureAndAnalyze()">
            <i class="fas fa-expand"></i> 抽出と図解解析を開始
        </button>
        <button class="btn-sub" onclick="toggleTorch()">
            <i class="fas fa-lightbulb"></i> ライト切替
        </button>
        <button class="btn-sub" onclick="document.getElementById('image-input').click()">
            <i class="fas fa-file-import"></i> 画像読込
        </button>
        <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
        <button class="btn-sub" onclick="copyToClipboard()">
            <i class="fas fa-copy"></i> 全体コピー
        </button>
        <button class="btn-save" onclick="saveAsFile()">
            <i class="fas fa-download"></i> 解析結果を保存 (.txt)
        </button>
    </div>

    <div class="result-box">
        <div class="floating-copy" onclick="copyToClipboard()"><i class="fas fa-paste"></i></div>
        <div id="markdown-view">ここに解析結果が表示されます</div>
        <textarea id="raw-text" style="display:none;"></textarea>
    </div>

    <div class="history-section">
        <div class="history-title"><i class="fas fa-history"></i> Recent History</div>
        <div id="historyList"></div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const filePreview = document.getElementById('file-preview');
    const canvas = document.getElementById('canvas');
    const markdownView = document.getElementById('markdown-view');
    const rawText = document.getElementById('raw-text');
    const status = document.getElementById('status');
    const previewBox = document.getElementById('preview-box');

    let videoStream = null;
    let isFileMode = false;
    let isTorchOn = false;

    window.onload = () => {
        const key = localStorage.getItem('gemini_api_key');
        if(key) document.getElementById('gemini-key').value = key;
        if(localStorage.getItem('dark_mode') === 'true') toggleTheme(true);
        setupCamera();
        loadHistory();
    };

    function toggleTheme(init = false) {
        const body = document.body;
        const isDark = init ? localStorage.getItem('dark_mode') === 'true' : body.classList.toggle('dark-mode');
        if(init && isDark) body.classList.add('dark-mode');
        localStorage.setItem('dark_mode', isDark);
        document.getElementById('theme-btn').innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    async function setupCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = videoStream;
            updateStatus("✅ Camera Ready", "#dcfce7", "#166534");
        } catch (err) {
            updateStatus("⚠️ Camera Restricted", "#fee2e2", "#991b1b");
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            filePreview.src = e.target.result;
            filePreview.style.display = "block";
            video.style.display = "none";
            isFileMode = true;
            updateStatus("📁 File Loaded", "#fef9c3", "#854d0e");
        };
        reader.readAsDataURL(file);
    }

    async function toggleTorch() {
        if (!videoStream || isFileMode) return alert("Torch only works in Camera Mode");
        const track = videoStream.getVideoTracks()[0];
        try {
            isTorchOn = !isTorchOn;
            await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        } catch (e) { alert("Torch not supported on this device"); }
    }

    async function captureAndAnalyze() {
        const key = document.getElementById('gemini-key').value.trim();
        if (!key) return alert("Please set API Key first");

        updateStatus("🚀 Analyzing Image...", "#eff6ff", "#1e40af");
        previewBox.classList.add('scanning');
        
        const context = canvas.getContext('2d');
        if (isFileMode) {
            canvas.width = filePreview.naturalWidth;
            canvas.height = filePreview.naturalHeight;
            context.drawImage(filePreview, 0, 0);
        } else {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);
        }

        const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

        // --- 強化されたプロンプト ---
        const customPrompt = `画像の内容を以下の3つのセクションで出力してください。

1. 【テキスト抽出・表のMarkdown化】
画像内に記載されているすべての文字を、構造を維持して書き出してください。表がある場合は必ずMarkdown形式に変換してください。

2. 【画像の内容解説】
この画像や図解が何を説明しているのか、その構造、プロセス、意図を詳しく分析して解説してください。

3. 【再現用生成プロンプト】
この画像（特に図解やイラスト部分）を、画像生成AI（DALL-E 3やMidjourney、Stable Diffusionなど）で「全く同じ構成と内容」で再現するための詳細なプロンプトを作成してください。被写体、配色、スタイル、配置、アスペクト比などを具体的に含めてください。

注意：回答に '\\n' （バックスラッシュとn）という文字列を絶対に含めないでください。改行したい場合は、実際の改行コード（Enterキーの改行）を使用してください。`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: customPrompt }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }] })
            });

            const data = await response.json();
            let result = data.candidates?.[0]?.content?.parts?.[0]?.text || "Analysis failed.";

            // 念のための置換処理
            result = result.replace(/\\n/g, '\n').replace(/\n\n+/g, '\n\n');

            markdownView.innerHTML = marked.parse(result);
            rawText.value = result;
            updateStatus("✅ Analysis Complete", "#dcfce7", "#166534");
            saveHistory(result);
        } catch (e) {
            updateStatus("❌ Error Occurred", "#fee2e2", "#991b1b");
        } finally {
            previewBox.classList.remove('scanning');
        }
    }

    function saveHistory(content) {
        let h = JSON.parse(localStorage.getItem('app_history') || '[]');
        h.unshift({ content, time: new Date().toLocaleString() });
        localStorage.setItem('app_history', JSON.stringify(h.slice(0, 10)));
        loadHistory();
    }

    function loadHistory() {
        const historyList = document.getElementById('historyList');
        const currentHistory = JSON.parse(localStorage.getItem('app_history') || '[]');
        historyList.innerHTML = currentHistory.map((item, index) => 
            `<div class="history-item" onclick="restoreHistory(${index})">
                <span><i class="far fa-clock"></i> ${item.time}</span>
                <i class="fas fa-chevron-right"></i>
            </div>`
        ).join('');
    }

    function restoreHistory(index) {
        const h = JSON.parse(localStorage.getItem('app_history') || '[]');
        const content = h[index].content;
        markdownView.innerHTML = marked.parse(content);
        rawText.value = content;
        updateStatus("📜 Restored from History", "#f1f5f9", "#475569");
        window.scrollTo({ top: document.querySelector('.result-box').offsetTop - 20, behavior: 'smooth' });
    }

    function copyToClipboard() {
        if (!rawText.value) return;
        navigator.clipboard.writeText(rawText.value).then(() => {
            alert("クリップボードにコピーしました");
        });
    }

    function saveAsFile() {
        if (!rawText.value) return;
        const blob = new Blob([rawText.value], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Vision_Analysis_${Date.now()}.txt`;
        a.click();
    }

    function saveKeys() {
        localStorage.setItem('gemini_api_key', document.getElementById('gemini-key').value);
        alert("APIキーを保存しました。");
    }

    function updateStatus(msg, bg, color) { 
        status.innerText = msg; 
        status.style.background = bg; 
        status.style.color = color;
    }
</script>
</body>
</html>
