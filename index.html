<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary: #4285f4; --success: #34a853; --danger: #ea4335; --dark: #202124; }
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; margin: 0; padding: 10px; color: var(--dark); }
        .container { max-width: 500px; margin: auto; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* 設定エリア */
        .settings { text-align: left; background: #f1f3f4; padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #dadce0; font-size: 13px; }
        input[type="password"] { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; }

        /* カメラエリア */
        .video-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 3/4; margin-bottom: 10px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* ボタン類 */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { padding: 15px; font-size: 16px; cursor: pointer; border: none; border-radius: 12px; font-weight: bold; color: white; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-capture { background: var(--primary); grid-column: span 2; border-radius: 30px; }
        .btn-torch { background: #f4b400; color: #000; }
        .btn-speak { background: var(--success); }
        .btn-stop { background: var(--danger); }

        /* 解析結果表示（Markdown対応） */
        #status { font-size: 12px; padding: 8px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; background: #fff3cd; }
        .result-container { text-align: left; background: #fff; border: 2px solid #eee; border-radius: 12px; padding: 15px; min-height: 100px; }
        
        /* Markdown表示用のスタイル */
        #markdown-view { font-size: 14px; line-height: 1.6; overflow-x: auto; }
        #markdown-view table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        #markdown-view th, #markdown-view td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #markdown-view th { background: #f8f9fa; }
        #markdown-view h1, #markdown-view h2 { font-size: 18px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="margin-top:0; color:var(--primary); text-align:center;">🤖 AI Vision Pro</h3>

    <div id="status">カメラ準備中...</div>

    <details class="settings">
        <summary>⚙️ APIキー設定</summary>
        <input type="password" id="gemini-key" placeholder="Gemini API Key">
        <input type="password" id="openai-key" placeholder="OpenAI API Key">
        <button onclick="saveKeys()" style="background:var(--dark); width:100%; margin-top:5px;">保存</button>
    </details>

    <div class="video-wrapper">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div class="controls">
        <button class="btn-capture" onclick="captureAndAnalyze()">📸 写真を撮って解析</button>
        <button class="btn-torch" id="torch-btn" onclick="toggleTorch()">🔦 ライト点灯</button>
        <button class="btn-speak" id="speak-btn" onclick="speakText()">🔊 読み上げ</button>
    </div>
    <button class="btn-stop" id="stop-btn" onclick="stopAudio()" style="display:none; width:100%;">⏹ 停止</button>

    <div class="result-container">
        <div id="markdown-view">ここに解析結果が表示されます</div>
        <textarea id="hidden-text" style="display:none;"></textarea>
    </div>

    <div style="margin-top:20px; text-align: left;">
        <strong>📜 履歴</strong>
        <div id="historyList"></div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const markdownView = document.getElementById('markdown-view');
    const hiddenText = document.getElementById('hidden-text');
    const status = document.getElementById('status');
    let audioInstance = null;
    let isTorchOn = false;
    let videoStream = null;

    window.onload = () => {
        document.getElementById('gemini-key').value = localStorage.getItem('gemini_api_key') || "";
        document.getElementById('openai-key').value = localStorage.getItem('openai_api_key') || "";
        setupCamera();
    };

    // --- カメラセットアップ ---
    async function setupCamera() {
        try {
            const constraints = { video: { facingMode: "environment" } };
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = videoStream;
            status.innerText = "✅ カメラ準備完了";
            status.style.background = "#d4edda";
        } catch (err) {
            status.innerText = "❌ カメラエラー: HTTPS環境か確認してください。";
        }
    }

    // --- ライト点灯機能（Android/Chrome対応） ---
    async function toggleTorch() {
        const track = videoStream.getVideoTracks()[0];
        const caps = track.getCapabilities();
        if (!caps.torch) return alert("この端末はライト制御に対応していません。");
        
        isTorchOn = !isTorchOn;
        await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        document.getElementById('torch-btn').innerText = isTorchOn ? "🔦 ライト消灯" : "🔦 ライト点灯";
    }

    function saveKeys() {
        localStorage.setItem('gemini_api_key', document.getElementById('gemini-key').value);
        localStorage.setItem('openai_api_key', document.getElementById('openai-key').value);
        alert("保存しました。");
    }

    // --- メイン解析処理 ---
    async function captureAndAnalyze() {
        const key = document.getElementById('gemini-key').value;
        if (!key) return alert("Geminiキーを設定してください。");

        status.innerText = "⌛ 文書を解析中...";
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0);
        const base64Image = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];

        // 究極のプロンプト
        const prompt = `あなたはプロの文書解析・OCRエキスパートです。画像の内容を以下のルールで正確にデジタル化してください。
        1. **文字認識**: 全てのテキストを正確に抽出してください。
        2. **表（テーブル）**: 表が含まれている場合は、必ずMarkdown形式の表に変換してください。
        3. **図解・イラスト**: フローチャートやグラフがある場合は、要素間の関係性を「【図の説明】」として詳しく解説してください。
        4. **構造化**: 読みやすさを重視し、見出し(#)や箇条書き(-)を使用して構造化してください。
        5. **制約**: 日本語で出力し、前置きや結びの言葉は一切含めず、解析結果のみを出力してください。`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [
                        { text: prompt },
                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                    ]}]
                })
            });
            const data = await response.json();
            const resultText = data.candidates[0].content.parts[0].text;

            // Markdownを描画
            markdownView.innerHTML = marked.parse(resultText);
            
            // 読み上げ用に記号を掃除したテキストを作成
            hiddenText.value = resultText.replace(/[|\\-]{2,}/g, ' ').replace(/[#*]/g, '');
            
            status.innerText = "✅ 解析完了（表・図解対応）";
            status.style.background = "#d4edda";
        } catch (e) {
            status.innerText = "❌ 解析失敗: " + e.message;
        }
    }

    async function speakText() {
        const key = document.getElementById('openai-key').value;
        const text = hiddenText.value;
        if (!key || !text) return alert("設定または結果がありません。");

        status.innerText = "⌛ 音声生成中...";
        try {
            const response = await fetch('https://api.openai.com/v1/audio/speech', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: "tts-1", input: text.substring(0, 4000), voice: "shimmer" })
            });
            const blob = await response.blob();
            if (audioInstance) audioInstance.pause();
            audioInstance = new Audio(URL.createObjectURL(blob));
            audioInstance.play();
            document.getElementById('stop-btn').style.display = "block";
        } catch (e) {
            status.innerText = "❌ 読み上げエラー";
        }
    }

    function stopAudio() {
        if (audioInstance) { audioInstance.pause(); document.getElementById('stop-btn').style.display = "none"; }
    }
</script>
</body>
</html>
